<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KHAGA — Studio administration</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/admin.css?v=0.4.0"><link rel="icon" href="/brand/emblem.svg"><script defer src="/admin.js?v=0.4.0"></script></head>
<body><header><a href="/admin" aria-label="KHAGA admin"><img src="/brand/wordmark.svg" width="160" height="30" alt="KHAGA"></a><span>STUDIO / COLLECTION MANAGEMENT</span><a href="/" target="_blank" rel="noopener">View storefront ↗</a></header>
<main id="admin-main"><section class="login-panel"><p class="eyebrow">PRIVATE WORKSPACE</p><h1>Make it<br><em>your collection.</em></h1><p>Sign in to manage products, colourways and imagery. Orders and payments remain closed.</p><form id="login-form" method="post" action="/api/admin/login"><fieldset id="login-fields" disabled><label>Email<input name="email" type="email" required autocomplete="username" maxlength="254"></label><label>Password<input name="password" type="password" required autocomplete="current-password" maxlength="1024"></label><button type="submit">Sign in securely</button></fieldset></form><noscript><p>JavaScript is required for the secure admin sign-in.</p></noscript><p id="login-error" class="error" role="alert"></p></section></main>
<div id="message" role="status" aria-live="polite"></div><dialog id="confirmation"><h2 id="confirm-title">Publish this preview?</h2><p id="confirm-copy">Only the saved draft is published. Payments remain disabled.</p><div class="actions"><button id="confirm-no" class="secondary">Cancel</button><button id="confirm-yes">Confirm</button></div></dialog></body></html>
